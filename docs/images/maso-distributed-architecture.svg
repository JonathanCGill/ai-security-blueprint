<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 580" width="840" height="580">
  <!-- Background -->
  <rect width="840" height="580" fill="#f8fafc"/>

  <!-- Title -->
  <text x="420" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#1e293b">MASO Distributed Security Architecture</text>
  <text x="420" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Layer 2 becomes a combination of reviewing controls, enforced at every hop.</text>

  <!-- Agent row -->
  <rect x="20" y="58" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="130" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Orchestrator Agent</text>
  <text x="130" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">delegates research task</text>

  <rect x="310" y="58" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="420" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Researcher Agent</text>
  <text x="420" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">queries data sources</text>

  <rect x="600" y="58" width="220" height="54" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="710" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Database Agent</text>
  <text x="710" y="98" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#3b82f6">read-only query executor</text>

  <!-- Arrows: agent -> sidecar -->
  <line x1="130" y1="112" x2="130" y2="130" stroke="#475569" stroke-width="2"/>
  <polygon points="130,132 125,122 135,122" fill="#475569"/>
  <line x1="420" y1="112" x2="420" y2="130" stroke="#475569" stroke-width="2"/>
  <polygon points="420,132 415,122 425,122" fill="#475569"/>
  <line x1="710" y1="112" x2="710" y2="130" stroke="#475569" stroke-width="2"/>
  <polygon points="710,132 705,122 715,122" fill="#475569"/>

  <!-- Sidecar row -->
  <rect x="20" y="132" width="220" height="50" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="130" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Security Sidecar</text>
  <text x="130" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a16207">Scanners + Classifiers</text>
  <text x="130" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a16207">&lt;50ms</text>

  <rect x="310" y="132" width="220" height="50" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="420" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Security Sidecar</text>
  <text x="420" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a16207">Scanners + Classifiers</text>
  <text x="420" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a16207">&lt;50ms</text>

  <rect x="600" y="132" width="220" height="50" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="710" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#854d0e">Security Sidecar</text>
  <text x="710" y="167" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a16207">Scanners + Classifiers</text>
  <text x="710" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#a16207">&lt;50ms</text>

  <!-- Arrows: sidecar -> bus -->
  <line x1="130" y1="182" x2="130" y2="198" stroke="#475569" stroke-width="2"/>
  <polygon points="130,200 125,190 135,190" fill="#475569"/>
  <line x1="420" y1="182" x2="420" y2="198" stroke="#475569" stroke-width="2"/>
  <polygon points="420,200 415,190 425,190" fill="#475569"/>
  <line x1="710" y1="182" x2="710" y2="198" stroke="#475569" stroke-width="2"/>
  <polygon points="710,200 705,190 715,190" fill="#475569"/>

  <!-- Bus band -->
  <rect x="10" y="200" width="820" height="60" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="420" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#5b21b6">Secured Inter-Agent Bus</text>
  <text x="420" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">Schema-validated &#183; mutually authenticated (NHI) &#183; jailbreak-contagion classifiers</text>
  <text x="420" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6d28d9">Non-conforming messages are dropped, not just flagged</text>

  <!-- Horizontal flow arrows within the bus -->
  <line x1="242" y1="230" x2="304" y2="230" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="308,230 298,225 298,235" fill="#8b5cf6"/>
  <line x1="532" y1="230" x2="594" y2="230" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="598,230 588,225 588,235" fill="#8b5cf6"/>

  <!-- Escalation path: bus -> Model-as-Judge (dashed, async) -->
  <line x1="420" y1="260" x2="420" y2="298" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4"/>
  <polygon points="420,300 415,290 425,290" fill="#94a3b8"/>
  <text x="430" y="284" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">anomaly escalation</text>
  <text x="430" y="296" font-family="Arial, sans-serif" font-size="9" fill="#94a3b8">(async, off critical path)</text>

  <!-- Model-as-Judge box (dashed) -->
  <rect x="310" y="300" width="220" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="420" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#475569">Model-as-Judge</text>
  <text x="420" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Full LLM evaluation</text>
  <text x="420" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#64748b">Third reviewing control, for escalations</text>

  <!-- Action gating path: bus -> Action Gate (solid) -->
  <line x1="710" y1="260" x2="710" y2="298" stroke="#475569" stroke-width="2"/>
  <polygon points="710,300 705,290 715,290" fill="#475569"/>

  <!-- Action Gate box -->
  <rect x="600" y="300" width="220" height="70" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="710" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">Agent-to-Agent IAM</text>
  <text x="710" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">Action Gate validates request</text>
  <text x="710" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#15803d">schema + NHI scope (IA-2.4, EC tiers)</text>

  <!-- Arrow: Action Gate -> Execute Agent -->
  <line x1="710" y1="370" x2="710" y2="398" stroke="#475569" stroke-width="2"/>
  <polygon points="710,400 705,390 715,390" fill="#475569"/>

  <!-- Execute Agent box -->
  <rect x="600" y="400" width="220" height="55" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="710" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Execute Agent</text>
  <text x="710" y="442" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#b91c1c">Holds privileged write credentials</text>

  <!-- Legend -->
  <rect x="30" y="476" width="16" height="16" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="56" y="488" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">1. Security Sidecar: deterministic scanners + purpose-built classifiers run locally, on every hop, in under 50ms</text>

  <rect x="30" y="508" width="16" height="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="56" y="520" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">2. Secured Inter-Agent Bus: schema enforcement and jailbreak-contagion classifiers; non-conforming traffic is dropped</text>

  <rect x="30" y="540" width="16" height="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="56" y="552" font-family="Arial, sans-serif" font-size="11" fill="#1e293b">3. Agent-to-Agent IAM: least privilege, separation of duties, and action gating before any privileged execution</text>
</svg>
