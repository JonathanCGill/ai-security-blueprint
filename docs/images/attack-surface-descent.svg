    <rect x="858" y="288" width="84" height="42" rx="3" fill="#38bdf8" opacity="0.46"/><text x="900" y="314" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono', monospace">2</text>
