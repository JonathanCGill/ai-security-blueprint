    <rect x="573" y="288" width="84" height="42" rx="3" fill="#38bdf8" opacity="0.22"/><text x="615" y="314" fill="#cbd5e1" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono', monospace">1</text>
    <rect x="668" y="288" width="84" height="42" rx="3" fill="#38bdf8" opacity="0.46"/><text x="710" y="314" fill="#e2e8f0" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono', monospace">2</text>
