<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="asdTitle asdDesc">
  <title id="asdTitle">Where the attacks landed, February to August 2026</title>
  <desc id="asdDesc">Sixty-nine news items classified by the layer the attack landed on and the month it was disclosed. The model and guardrail layer peaks in March and never repeats. State and internal channels concentrate in June. Environment and operator peaks in July. August spreads across five layers, with every item concerning composition rather than a single component. Governance and standards output is tracked separately as a response track.</desc>

