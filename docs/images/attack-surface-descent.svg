    <text x="40" y="506" fill="#64748b" font-size="10.5">the response track</text>
    <rect x="383" y="470" width="84" height="42" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="478" y="470" width="84" height="42" rx="3" fill="#f59e0b" opacity="0.92"/><text x="520" y="496" fill="#0f172a" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-weight="600">6</text>
    <rect x="573" y="470" width="84" height="42" rx="3" fill="#f59e0b" opacity="0.66"/><text x="615" y="496" fill="#0f172a" font-size="12" text-anchor="middle" font-family="'IBM Plex Mono', monospace">4</text>
