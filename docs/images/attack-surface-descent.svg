    <text x="40" y="552" fill="#7dd3fc" font-size="11" font-family="'IBM Plex Mono', monospace" letter-spacing="0.8">READING THE GRID</text>
    <text x="40" y="574">March peaks at the model layer and never repeats. June concentrates in memory and internal channels. July is the month the agent becomes the operator.</text>
    <text x="40" y="594">August spreads evenly across five layers, and every item in it is about how components combine rather than any single one of them.</text>
