    <text x="40" y="378" fill="#64748b" font-size="10.5">memory, inter-agent traffic</text>
    <rect x="383" y="342" width="84" height="42" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="478" y="342" width="84" height="42" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="573" y="342" width="84" height="42" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
