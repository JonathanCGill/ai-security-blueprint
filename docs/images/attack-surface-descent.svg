    <linearGradient id="asdBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="620" fill="url(#asdBg)"/>

