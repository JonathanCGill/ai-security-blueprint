<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="680" height="360" rx="10" fill="#FAFAFA"/>

  <!-- Human Oversight layer -->
  <rect x="40" y="20" width="440" height="56" rx="8" fill="#1565C0" filter="url(#shadow)"/>
  <text x="260" y="44" text-anchor="middle" fill="white" font-size="14" font-weight="600">Human Oversight</text>
  <text x="260" y="62" text-anchor="middle" fill="#BBDEFB" font-size="11">edge cases, accountability, final authority</text>

  <!-- Reviewing controls layer: three independent checks -->
  <rect x="40" y="88" width="440" height="96" rx="8" fill="#7B1FA2" filter="url(#shadow)"/>
  <text x="260" y="108" text-anchor="middle" fill="white" font-size="14" font-weight="600">Reviewing controls</text>
  <!-- check 1: scanners -->
  <rect x="54" y="118" width="129" height="54" rx="6" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.32"/>
  <text x="118" y="142" text-anchor="middle" fill="white" font-size="11.5" font-weight="600">Scanners</text>
  <text x="118" y="157" text-anchor="middle" fill="#EAD6F2" font-size="9">rules · PII · regex</text>
  <!-- check 2: semantic firewall -->
  <rect x="195" y="118" width="129" height="54" rx="6" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.32"/>
  <text x="259" y="142" text-anchor="middle" fill="white" font-size="11.5" font-weight="600">Semantic firewall</text>
  <text x="259" y="157" text-anchor="middle" fill="#EAD6F2" font-size="9">intent match</text>
  <!-- check 3: model-as-judge -->
  <rect x="336" y="118" width="129" height="54" rx="6" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.32"/>
  <text x="400" y="142" text-anchor="middle" fill="white" font-size="11.5" font-weight="600">Model-as-Judge</text>
  <text x="400" y="157" text-anchor="middle" fill="#EAD6F2" font-size="9">policy &amp; quality</text>

  <!-- Guardrails layer -->
  <rect x="40" y="196" width="440" height="56" rx="8" fill="#2E7D32" filter="url(#shadow)"/>
  <text x="260" y="220" text-anchor="middle" fill="white" font-size="14" font-weight="600">Guardrails</text>
  <text x="260" y="238" text-anchor="middle" fill="#C8E6C9" font-size="11">input / output filtering, injection detection, real-time</text>

  <!-- AI System layer -->
  <rect x="40" y="264" width="440" height="56" rx="8" fill="#455A64" filter="url(#shadow)"/>
  <text x="260" y="288" text-anchor="middle" fill="white" font-size="14" font-weight="600">AI System</text>
  <text x="260" y="306" text-anchor="middle" fill="#CFD8DC" font-size="11">your LLM, agent, or pipeline</text>

  <!-- Annotations on right side -->
  <line x1="490" y1="48" x2="510" y2="48" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="510" y1="48" x2="510" y2="292" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="490" y1="136" x2="510" y2="136" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="490" y1="224" x2="510" y2="224" stroke="#90A4AE" stroke-width="1.5"/>
  <line x1="490" y1="292" x2="510" y2="292" stroke="#90A4AE" stroke-width="1.5"/>

  <!-- Right-side labels -->
  <text x="524" y="44" fill="#1565C0" font-size="11" font-weight="600">As needed</text>
  <text x="524" y="58" fill="#78909C" font-size="10">Escalated decisions</text>

  <text x="524" y="132" fill="#7B1FA2" font-size="11" font-weight="600">~5ms – 5s</text>
  <text x="524" y="146" fill="#78909C" font-size="10">Scanners inline, judge async</text>

  <text x="524" y="220" fill="#2E7D32" font-size="11" font-weight="600">~10ms</text>
  <text x="524" y="234" fill="#78909C" font-size="10">Every transaction</text>

  <text x="524" y="288" fill="#455A64" font-size="11" font-weight="600">Your model</text>
  <text x="524" y="302" fill="#78909C" font-size="10">Task execution</text>

  <!-- Bottom caption -->
  <text x="340" y="344" text-anchor="middle" fill="#546E7A" font-size="12" font-weight="500">Reviewing controls combine three independent checks before output reaches a user.</text>
</svg>
